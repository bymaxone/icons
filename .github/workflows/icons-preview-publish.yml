# Icon preview, the privileged half. `workflow_run` runs this file from the default branch
# with a token that can write, after the unprivileged half finishes.
#
# It never checks out or runs pull-request code: it checks out the default branch, needs
# no dependency (the publish script imports nothing that parses or renders a drawing), and
# treats the artifact as hostile. The manifest is validated field by field, every image
# must be a PNG of bounded size named by a strict pattern, and the pull request must be
# open on the commit, repository and branch the run built. Each job holds only the write
# its own step needs: `contents: write` to store the images on the `icons-preview` branch,
# which shares no history with `main`, and `pull-requests: write` to write the comment.
name: Icon preview publish

on:
  # zizmor: ignore[dangerous-triggers] the privileged half of a split preview: this file
  # runs from the default branch, checks out no pull-request code, runs nothing from the
  # artifact, and validates every field it reads from it (see the header above).
  workflow_run:
    workflows: [Icon preview]
    types: [completed]

permissions: {}

jobs:
  images:
    name: Store the preview images
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time per pull-request branch. The group sits on the job, not the
    # workflow: a run whose jobs are skipped never joins it, so it cannot cancel a publish
    # that is running. Publishes of different pull requests share the icons-preview branch;
    # the publish script retries a write that loses that race.
    concurrency:
      group: icons-preview-images-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read # downloads the artifact of the run that built it
      contents: write # stores the images on the icons-preview branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icons-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/icons-preview
      - name: Validate and store the images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/icons-preview-publish.mjs publish --dir "$RUNNER_TEMP/icons-preview"

  comment:
    name: Write the preview comment
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: icons-preview-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      actions: read # downloads the artifact of the run that built it
      contents: read # checks out the default branch
      pull-requests: write # writes the preview comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icons-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/icons-preview
      - name: Validate and write the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/icons-preview-publish.mjs comment --dir "$RUNNER_TEMP/icons-preview"
