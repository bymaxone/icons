# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (hygiene, install, lint, typecheck, format, unit+coverage,
# mutation) run via node-lib-ci.yml. This library's extra verification (the icon lint,
# the stale-copy check of the generated modules, build output integrity across every
# subpath, published type resolution, consumer load from the packed tarball,
# bundle-size budget, and the fixture package build) stays here. Mutation runs only on a push to
# main / manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: true
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'
      # The per-push run is incremental and finishes in minutes; this ceiling exists for the
      # cold one — the first run after enabling incremental, and any run whose baseline cache
      # expired. The job is CANCELLED rather than failed when it lands, which reads as an
      # infrastructure blip instead of a budget.
      mutation-timeout-minutes: 45

  # Library-specific verification: full build, output integrity across every
  # declared subpath, published type resolution, consumer load and the brotli
  # bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install step below runs the pull request's own scripts; the read-only token must
          # not stay in the repository's git configuration for them to read.
          persist-credentials: false
          # The length check compares a pull request's baseline with its base branch's.
          fetch-depth: 0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Source files stay within the length limit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is also checked against the baseline on its base branch, so the
          # baseline it carries cannot admit the offender it adds.
          if [ -n "$BASE_REF" ]; then
            pnpm check:file-length --base "origin/$BASE_REF"
          else
            pnpm check:file-length
          fi
      - name: Import-graph rules can see the module graph
        # A graph rule resolves a dependency and then parses it separately, and
        # it skips in silence any extension it cannot map to a parser. So the
        # rule reports nothing on a TypeScript project while `--print-config`
        # still shows it enabled -- which is how a cycle gate stays green on a
        # real cycle. This makes one and requires the lint to reject it.
        run: pnpm check:lint-graph
      - name: Prove ./meta refuses React
        # A `paths` entry matches one exact specifier and a `files` glob can
        # leave an extension out, so the rule is proven on real probes.
        run: pnpm check:meta-react
      - name: Icon lint
        # Every rule of the SVG and metadata sources: allowed elements and attributes,
        # fills, precision, live area, names, schemas, aliases and variants.
        run: pnpm lint:icons
      - name: Generated modules match the sources
        # Regenerates src/**/generated from icons/ and fails when the committed copy
        # differs, so a hand edit or a forgotten `pnpm generate` cannot merge.
        run: pnpm check:generated
      - name: Drawings match their visual baselines
        # Renders every drawing at 16, 20, 24 and 48 px on the light and dark pages and
        # compares it pixel by pixel with visual/, so a drawing cannot change without its
        # reviewed baseline changing in the same pull request.
        run: pnpm check:visual
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # type declarations, and that the static outputs exist. A missing artifact
        # here indicates a tsup misconfiguration that would ship a broken package
        # to npm. The icon entries are checked by the fixture package step below.
        run: |
          for subpath in index runtime/index meta/index brands/index; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath.$ext" ]; then
                echo "Missing dist/$subpath.$ext"
                exit 1
              fi
            done
          done
          for file in sprite.svg metadata.json; do
            if [ ! -f "dist/$file" ]; then
              echo "Missing dist/$file"
              exit 1
            fi
          done
          echo "Every entry point produced ESM + CJS + .d.ts + .d.cts, and the static outputs exist"
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may still
        # land on declarations for the wrong module format. `attw` resolves every
        # entry point of the packed tarball the way each resolution mode does.
        run: pnpm check:exports
      - name: Consumer runtime
        # Loads every subpath from the packed tarball, in ESM and in CommonJS. The
        # root imports `./meta` by package specifier, so this is also the gate that
        # proves the specifier resolves through the published `exports` map.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size
      - name: Fixture package
        # The repository's own icons/ may be empty, so the steps above prove the empty
        # set. This builds a scratch copy with the placeholder drawings of
        # fixtures/icons and runs the generator, the type checks, the smoke test, the
        # build, the size budgets, attw, the consumer runtime and the dogfood install on it.
        run: pnpm check:fixtures

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped check reports
  # neutral — the pull request would look unblocked precisely when it is broken.
  # `cancelled` is named explicitly for the same reason; a cancelled job is not
  # a passing one, and a queue timeout produces exactly that.
  #
  # A skipped dependency is accepted on purpose: jobs here are conditional on the
  # event, and failing on skip would break every push that legitimately runs a
  # subset.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Named for what the condition does: `skipped` is deliberately not a failure
      # here, so "did not succeed" would describe a stricter gate than this is.
      - name: Fail when any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
